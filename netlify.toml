# AI.tutor design vault
#
# publish is _site, assembled by src/build.py from docs/, evidence/ and
# contracts/.
#
# It cannot be docs/ alone: evidence/ is a sibling, and every claim carrying a
# Verified marker links to the evidence register, so publishing docs/ makes that
# register 404 and silently breaks the rule the whole vault rests on. contracts/
# is linked from the documents for the same reason.
#
# It is no longer the repository root either: that put BUILD_BRIEF.md and src/
# on public URLs. Assembling an explicit directory means those are never
# uploaded, rather than uploaded and hidden behind a rule.

[build]
  publish = "_site"
  command = "python3 src/build.py"

# The site root redirects to the front page. It must be a redirect, not a
# rewrite: a 200 rewrite served docs/index.html at "/", so the page's relative
# stylesheet and links resolved against the root, the stylesheet 404'd and the
# first page anyone opened rendered as unstyled text with broken links. A 302
# rather than a 301, so that browsers do not cache it permanently.
[[redirects]]
  from = "/"
  to = "/docs/index.html"
  status = 302

# Headers are generated into _site/_headers by src/build.py, not written here.
# The map at /map/ is the one page that runs a script, and its policy names the
# SHA-256 of each of that page's own inline blocks rather than allowing inline
# script generally. Those hashes have to be computed from the file, so the whole
# set of header rules is emitted by the build to keep one source of truth, and
# to keep the strict policy on /docs/, /evidence/ and /contracts/ from
# overlapping the map's on any path.
