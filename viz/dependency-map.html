<style>
:root{
  --ground:#0E1417;
  --ground-2:#121A1E;
  --panel:#151D21;
  --panel-2:#1A2429;
  --rule:#27343A;
  --rule-soft:#1E292E;
  --ink:#E7EEF0;
  --ink-2:#A8BAC1;
  --ink-3:#74888F;
  --accent:#E4622B;
  --down:#E8B33C;
  --up:#4FB3A6;
  --side:#9A86DE;
  --oblig:#CE5A72;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --panel-w:23.5rem;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--font);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- command bar ---------- */
.bar{
  display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;max-width:100%;
  padding:.6rem 1rem;padding-top:calc(.6rem + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--rule);background:var(--ground-2);
  position:relative;z-index:6;
}
.mark{display:flex;align-items:baseline;gap:.5rem;margin-right:.3rem;flex:none}
.mark b{font-weight:700;font-stretch:112%;letter-spacing:.055em;font-size:.95rem;text-transform:uppercase}
.mark span{font-family:var(--mono);font-size:.68rem;color:var(--ink-3);letter-spacing:.04em}
.mark .back{font-family:var(--mono);font-size:.68rem;color:var(--ink-3);letter-spacing:.04em;text-decoration:none;border-bottom:1px solid var(--rule);margin-left:.35rem}
.mark .back:hover{color:var(--accent);border-color:var(--accent)}
.kinds{display:flex;gap:1px;min-width:0;max-width:100%;background:var(--rule-soft);border:1px solid var(--rule);border-radius:2px;overflow-x:auto;scrollbar-width:none}
.kinds::-webkit-scrollbar{display:none}
.kinds button{
  padding:.34rem .6rem;font-size:.74rem;letter-spacing:.045em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap;background:var(--ground-2);font-weight:600;
}
.kinds button:hover{color:var(--ink-2)}
.kinds button[aria-pressed="true"]{background:var(--accent);color:#120A05}
.bar .spacer{flex:1 1 auto}
.viewbtns{display:flex;gap:.4rem}
.viewbtns button{
  font-family:var(--mono);font-size:.7rem;color:var(--ink-3);
  border:1px solid var(--rule);border-radius:2px;padding:.3rem .5rem;
}
.viewbtns button:hover{color:var(--ink);border-color:var(--ink-3)}
.viewbtns button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.kindhint{
  font-size:.75rem;color:var(--ink-3);flex-basis:100%;
  font-family:var(--mono);letter-spacing:.01em;
}

/* ---------- stage ---------- */
.stage{position:relative;min-height:0;overflow:hidden}
#viz{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#viz.dragging{cursor:grabbing}

.legend{
  position:absolute;left:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));
  z-index:3;display:flex;flex-direction:column;gap:.55rem;
  pointer-events:none;max-width:15rem;
}
.legend .grp{pointer-events:auto;background:rgba(14,20,23,.82);border:1px solid var(--rule-soft);border-radius:2px;padding:.5rem .6rem}
.legend h4{
  margin:0 0 .4rem;font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;
}
.legend .row{display:flex;align-items:center;gap:.45rem;font-size:.75rem;color:var(--ink-2);padding:.09rem 0}
.swatch{width:.62rem;height:.62rem;border-radius:50%;flex:none}
.c-origin{background:#E4622B}.c-down{background:#E8B33C}.c-up{background:#4FB3A6}
.c-side{background:#9A86DE}.c-oblig{background:#CE5A72}
.s-obligation{background:#CE5A72}.s-surface{background:#D9A441}
.s-orchestration{background:#E4622B}.s-engine{background:#5FA8C9}
.s-data{background:#4FB3A6}.s-supply{background:#9A86DE}
.strata{display:flex;flex-direction:column;gap:1px}
.strata button{
  display:flex;align-items:center;gap:.45rem;width:100%;text-align:left;
  font-size:.75rem;color:var(--ink-2);padding:.11rem .1rem;
}
.strata button[aria-pressed="false"]{color:var(--ink-3);opacity:.5;text-decoration:line-through}
.strata .bar-i{width:1.4rem;height:2px;flex:none;border-radius:1px}

.hoverchip{
  position:absolute;z-index:4;pointer-events:none;
  background:var(--panel);border:1px solid var(--rule);border-radius:2px;
  padding:.3rem .5rem;font-size:.76rem;max-width:15rem;
  box-shadow:0 6px 22px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;
}
.hoverchip b{display:block;font-weight:600}
.hoverchip i{font-style:normal;font-family:var(--mono);font-size:.68rem;color:var(--ink-3)}

/* ---------- inspector ---------- */
.panel{
  position:absolute;top:0;right:0;bottom:0;width:var(--panel-w);z-index:5;
  background:rgba(21,29,33,.94);border-left:1px solid var(--rule);
  overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;
}
.phead{padding:.85rem 1rem .75rem;border-bottom:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:.55rem}
.pickrow{display:flex;gap:.4rem;align-items:center}
.pickrow label{font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
select{
  flex:1;font:inherit;font-size:.8rem;background:var(--ground-2);color:var(--ink);
  border:1px solid var(--rule);border-radius:2px;padding:.3rem .4rem;min-width:0;
}
.ptitle{font-size:1.28rem;line-height:1.18;font-weight:700;text-wrap:balance;margin:0}
.chips{display:flex;gap:.35rem;flex-wrap:wrap}
.chip{
  font-family:var(--mono);font-size:.66rem;letter-spacing:.03em;
  padding:.13rem .38rem;border-radius:2px;border:1px solid var(--rule);color:var(--ink-2);
}
.chip.own{border-color:#3C6E63;color:#7FD0C2}
.chip.buy{border-color:#6E5C38;color:#D9B166}
.chip.process{border-color:#4B5E74;color:#93B2D0}
.chip.policy{border-color:#7A3F4D;color:#E48297}
.pnote{margin:0;font-size:.85rem;color:var(--ink-2);line-height:1.5}

.readout{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--rule-soft)}
.readout div{padding:.7rem 1rem;border-top:1px solid var(--rule-soft)}
.readout div:first-child{border-right:1px solid var(--rule-soft)}
.readout .n{
  font-size:2.1rem;font-weight:700;font-stretch:118%;line-height:1;
  font-variant-numeric:tabular-nums;display:block;
}
.readout .k{font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.readout .down .n{color:var(--down)}
.readout .up .n{color:var(--up)}

.sect{padding:.85rem 1rem;border-bottom:1px solid var(--rule-soft)}
.sect h3{
  margin:0 0 .5rem;font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:.4rem;
}
.sect h3 .dot{width:.5rem;height:.5rem;border-radius:50%;flex:none}
.hit{
  display:grid;grid-template-columns:auto 1fr;gap:.1rem .5rem;align-items:baseline;
  width:100%;text-align:left;padding:.24rem .3rem;border-radius:2px;
}
.hit:hover{background:var(--panel-2)}
.hit .hop{font-family:var(--mono);font-size:.64rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.hit .nm{font-size:.82rem;color:var(--ink)}
.hit .via{grid-column:2;font-family:var(--mono);font-size:.66rem;color:var(--ink-3)}
.stops{background:var(--panel-2);border-left:2px solid var(--up);padding:.5rem .6rem;margin-top:.4rem;border-radius:0 2px 2px 0}
.stops p{margin:0 0 .3rem;font-size:.78rem;color:var(--ink-2)}
.stops p:last-child{margin-bottom:0}
.stops b{color:var(--up);font-family:var(--mono);font-size:.72rem;font-weight:500}
.reg{display:flex;flex-direction:column;gap:.4rem}
.reg a,.reg .item{display:grid;grid-template-columns:4.2rem 1fr;gap:.5rem;align-items:baseline;text-decoration:none}
.reg code{
  font-family:var(--mono);font-size:.68rem;color:var(--ink);background:var(--panel-2);
  border:1px solid var(--rule);border-radius:2px;padding:.08rem .25rem;text-align:center;

.reg span{font-size:.78rem;color:var(--ink-2);line-height:1.42}
.reg .t code{border-color:#3C6E63;color:#7FD0C2}
.reg .o code{border-color:#7A3F4D;color:#E48297}
.reg .r code{border-color:#6E5C38;color:#D9B166}
.empty{font-size:.78rem;color:var(--ink-3);font-style:italic}
.pfoot{padding:.85rem 1rem;color:var(--ink-3);font-size:.72rem;line-height:1.5;margin-top:auto}
.pfoot b{color:var(--ink-2);font-weight:600}

@media (max-width:62rem){
  :root{--panel-w:20rem}
  .legend{max-width:11rem}
}
@media (max-width:46rem){
  body{font-size:14px}
  .panel{
    top:auto;left:0;width:auto;height:58%;
    border-left:none;border-top:1px solid var(--rule);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .legend{display:none}
  .bar{gap:.55rem;padding:.5rem .7rem;padding-top:calc(.5rem + env(safe-area-inset-top,0px))}
  .kindhint{display:none}
  .viewbtns{display:none}
  .readout .n{font-size:1.7rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>

{"id": "eng.citation", "st": "engine", "sec": "pipeline", "own": "own", "label": "Citation presence", "note": "A deterministic parse. Every sentence classified as a substantive curricular assertion must cite a node in the permitted set. Cheap to detect, and blocking.", "t": ["T-GND-01"], "locus": "06-architecture#verifier"},
{"id": "eng.entail", "st": "engine", "sec": "pipeline", "own": "own", "label": "Claim support", "note": "An entailment check on a pinned cheaper model, given the cited node and the assertion only.", "t": ["T-GND-01"], "d": ["D27"], "r": ["R6"], "locus": "06-architecture#verifier"},
{"id": "eng.scope", "st": "engine", "sec": "pipeline", "own": "own", "label": "Scope classifier", "note": "A classifier against the declared objective set. A question adjacent to the objective gets a refusal rather than an answer, which is the trade the whole product makes.", "t": ["T-SCP-01"], "r": ["R3"], "locus": "06-architecture#verifier"},
{"id": "eng.renderer", "st": "engine", "sec": "style", "own": "own", "label": "Style card renderer", "note": "Deterministic and versioned, mapping each dimension to a band and emitting the instruction for that band. The only path by which a card comes into existence.", "t": ["T-STY-03"], "d": ["D7", "D8"], "locus": "02-style-engine#card"},
{"id": "eng.killswitch", "st": "engine", "sec": "style", "own": "own", "label": "Kill-switch read path", "note": "One boolean read per request, with a hard sixty-second cache ceiling. The flag is re-read at every turn, not at session start, which is why the bound is a turn and not a session.", "t": ["T-ZERO-01"], "d": ["D11", "D29"], "abs": {"kinds": ["removal"], "f": 0.2, "why": "Every persona feature degrades to an archetype, so withdrawing a preset stops here. D11, proven by T-ZERO-01."}, "locus": "06-architecture#killswitch"},
{"id": "eng.signature", "st": "engine", "sec": "style", "own": "own", "label": "Signature extraction", "note": "Twelve counted signatures per turn. This is what turns a style claim into a measurement over live traffic rather than an assertion.", "t": ["T-STY-01", "T-STY-02"], "d": ["D7"], "locus": "02-style-engine#conformance"},
{"id": "eng.mastery", "st": "engine", "sec": "assessment", "own": "own", "label": "Mastery model", "note": "Unaided-check results on validated items, and the only input the grade range is allowed to read.", "d": ["D15"], "locus": "06-architecture#derived"},
{"id": "eng.paperasm", "st": "engine", "sec": "assessment", "own": "own", "label": "Paper assembler", "note": "Constraint satisfaction over the bank: mark total, coverage profile, command-word mix and difficulty distribution, excluding items seen recently.", "t": ["T-PAP-01"], "o": ["OI-3"], "locus": "06-architecture#derived"},
{"id": "eng.grademap", "st": "engine", "sec": "assessment", "own": "own", "label": "Grade range mapper", "note": "An arithmetic mapping from performance to a band, with an evidence-sufficiency gate below which nothing is shown. Falsifiable, which a model estimate would not be.", "t": ["T-CAL-01"], "d": ["D35"], "o": ["OI-11"], "r": ["R11"], "locus": "06-architecture#derived"},
{"id": "eng.classifier", "st": "engine", "sec": "safety", "own": "mixed", "label": "Safety classification", "note": "Classifiers bought, policy and routing owned.", "r": ["R4"], "abs": {"kinds": ["vendor"], "f": 0.35, "why": "The classifier is bought but the policy is not, so swapping a provider does not move the routing."}, "locus": "06-architecture#planes"},
{"id": "db.items", "st": "data", "sec": "content", "own": "own", "label": "Item bank", "note": "Roughly 60 objectives and roughly 600 items at launch, as a planning figure rather than a count, every one examiner-validated before a learner sees it. The moat.", "t": ["T-VAL-01"], "d": ["D12"], "r": ["R7", "R9"], "locus": "03-curriculum-and-content#scope"},
{"id": "db.objectives", "st": "data", "sec": "content", "own": "own", "label": "Objective graph", "note": "Specification reference, tier, prerequisites and must-warn misconceptions. A session teaches one of these, not a topic heading.", "o": ["OI-9"], "locus": "06-architecture#data"},
{"id": "db.validation", "st": "data", "sec": "content", "own": "own", "label": "Validation records", "note": "Validator identity, date, result, notes and the date the item must be revalidated. The evidence behind P1.", "t": ["T-VAL-01"], "d": ["D20"], "r": ["R7"], "locus": "03-curriculum-and-content#validation"},
{"id": "db.presets", "st": "data", "sec": "style", "own": "own", "label": "Preset registry", "note": "One row per persona, and one boolean in that row is the entire kill switch.", "t": ["T-ZERO-01"], "d": ["D11"], "locus": "06-architecture#data"},
{"id": "db.styleobj", "st": "data", "sec": "style", "own": "own", "label": "Style objects", "note": "Twelve integers, a register note, a renderer version and a provenance record. It contains no creator material, which is the property that makes the rights position tractable.", "t": ["T-STY-04"], "d": ["D7", "D8", "D17"], "r": ["R1"], "locus": "02-style-engine#set"},
{"id": "db.licences", "st": "data", "sec": "style", "own": "own", "label": "Licence register", "note": "Term, schedules and status per preset. This is what the kill switch is enforcing.", "d": ["D9"], "o": ["OI-6"], "r": ["R1"], "locus": "06-architecture#data"},
{"id": "db.snapshot", "st": "data", "sec": "style", "own": "own", "label": "Preset snapshot", "note": "The style object as it stood at session start, so a transcript can still be explained after a preset changes. Purged on the same seven-day line as the object itself.", "d": ["D5"], "r": ["R1"], "locus": "06-architecture#data"},
{"id": "db.turns", "st": "data", "sec": "pipeline", "own": "own", "label": "Session and turn log", "note": "Citations, verdicts, gate result and style signatures per turn. Not browsable by anyone: access needs one of exactly three conditions and every access is logged with a reason.", "d": ["D16"], "o": ["OI-8"], "locus": "05-safety-privacy-regulatory#data"},
{"id": "db.mastery", "st": "data", "sec": "assessment", "own": "own", "label": "Mastery state", "note": "Attempts, unaided passes, last seen, due. This is profiling, and there is no version of adaptive tutoring that avoids it.", "o": ["OI-10"], "r": ["R4"], "locus": "05-safety-privacy-regulatory#basis"},
{"id": "db.grade", "st": "data", "sec": "assessment", "own": "own", "label": "Grade range record", "note": "Band, evidence count, coverage, and two booleans: sufficient, and calibrated, which is false at launch and stays false until a cohort sits a real examination.", "t": ["T-CAL-01"], "d": ["D35"], "r": ["R11"], "locus": "06-architecture#derived"},
{"id": "db.papers", "st": "data", "sec": "assessment", "own": "own", "label": "Paper store", "note": "Assembled papers with their checks recorded, and the structural specification each was built to.", "t": ["T-PAP-01"], "locus": "06-architecture#derived"},
{"id": "db.learner", "st": "data", "sec": "assessment", "own": "own", "label": "Learner profile", "note": "Year group, preset and per-subject adjustments. There is no date of birth field in this schema, anywhere, by design.", "d": ["D10"], "o": ["OI-10"], "locus": "05-safety-privacy-regulatory#data"},
{"id": "db.accounts", "st": "data", "sec": "safety", "own": "own", "label": "Account record", "note": "A verification boolean, a method identifier, a provider reference and a timestamp. No document, image or biometric is ever held.", "o": ["OI-5", "OI-7"], "r": ["R4"], "locus": "05-safety-privacy-regulatory#data"},
{"id": "db.escalations", "st": "data", "sec": "safety", "own": "own", "label": "Escalation records", "note": "Retention is longer than transcripts and is not yet set, because the safeguarding policy that would set it does not exist. A commitment with no number behind it.", "o": ["OI-4"], "r": ["R4"], "locus": "05-safety-privacy-regulatory#gaps"},
{"id": "ext.dfe", "st": "supply", "sec": "content", "own": "external", "label": "DfE subject content", "note": "The published specification the bank is written from. The licence under which that may be done commercially is unanswered.", "o": ["OI-9"], "r": ["R1"], "locus": "03-curriculum-and-content#cleanroom"},
{"id": "ext.board", "st": "supply", "sec": "content", "own": "external", "label": "Board paper structure", "note": "Command words, mark tariffs, paper structure and time allowances, observed from papers we may not reproduce. The sharpest edge in the clean room.", "d": ["D19", "D34"], "o": ["OI-1", "OI-2", "OI-3"], "r": ["R1"], "locus": "04-rights-dossier#line"},
{"id": "proc.authoring", "st": "supply", "sec": "content", "own": "process", "label": "Item writers", "note": "CINE writers working from the published subject content, never from board or textbook material. The writer and the validator are always different people.", "d": ["D12"], "r": ["R7"], "locus": "03-curriculum-and-content#cleanroom"},
{"id": "proc.validators", "st": "supply", "sec": "content", "own": "process", "label": "Examiner validators", "note": "Current or recent examiners on terms that forbid bringing awarding-body material. A rate-limited human process that does not get cheaper when the next model ships.", "t": ["T-VAL-01"], "d": ["D20"], "r": ["R7"], "locus": "03-curriculum-and-content#validation"},
{"id": "proc.raters", "st": "supply", "sec": "style", "own": "process", "label": "Style raters", "note": "Three independent qualified raters per preset, scoring twelve dimensions without sight of each other, with a reliability gate and unfitted dimensions flagged rather than guessed.", "t": ["T-STY-02"], "d": ["D7"], "locus": "02-style-engine#preset"},
{"id": "proc.creator", "st": "supply", "sec": "style", "own": "process", "label": "Creator review right", "note": "The creator sees the twelve numbers and the rendered card and may object before the preset goes live. A term of the licence, not a courtesy.", "d": ["D5"], "o": ["OI-6"], "r": ["R1"], "locus": "04-rights-dossier#creator"},
{"id": "ext.genvendor", "st": "supply", "sec": "pipeline", "own": "buy", "label": "Generator vendor", "note": "Pinned, abstracted, and disqualified regardless of model quality if zero-retention terms cannot be had.", "d": ["D22", "D24"], "r": ["R6"], "locus": "06-architecture#model"},
{"id": "ext.verifyvendor", "st": "supply", "sec": "pipeline", "own": "buy", "label": "Verifier vendor", "note": "Deliberately a different vendor from the generator. Two relationships to qualify instead of one, which is the price of not sharing a failure mode.", "d": ["D24", "D27"], "r": ["R6"], "locus": "06-architecture#model"},
{"id": "ext.ageassurance", "st": "supply", "sec": "safety", "own": "buy", "label": "Age assurance provider", "note": "Certified to a recognised standard, returning a result rather than a document. We want a boolean, not an identity document sitting in our database.", "o": ["OI-5"], "r": ["R4"], "locus": "05-safety-privacy-regulatory#age"},
{"id": "ext.safetyvendor", "st": "supply", "sec": "safety", "own": "buy", "label": "Classifier vendor", "note": "Bought. The policy and the routing are not.", "r": ["R4"], "locus": "06-architecture#planes"},
{"id": "ext.billingvendor", "st": "supply", "sec": "commerce", "own": "buy", "label": "Payments", "note": "And the app stores, which are also the route by which a regulatory disruption order would arrive.", "r": ["R5"], "locus": "04-rights-dossier#wargame"},
{"id": "ext.cdn", "st": "supply", "sec": "commerce", "own": "buy", "label": "CDN and store metadata", "note": "Twenty-four hours in the kill-switch timetable, by a scripted purge rehearsed in advance rather than assembled on the day.", "d": ["D29"], "r": ["R5"], "locus": "04-rights-dossier#killswitch"},
{"id": "ext.schoolidp", "st": "supply", "sec": "commerce", "own": "buy", "label": "School identity provider", "note": "Route B. The school already knows who its pupils are, and age assurance largely dissolves as a problem.", "d": ["D3"], "locus": "08-route-b-through-schools#data"},
{"id": "ui.primer", "st": "surface", "sec": "pipeline", "own": "own", "label": "Primer conversation", "note": "A why-question, spoken or typed, answered at once at a high level and then in one shape: a checked fact with its source, the harder bit, three positions at their strongest, the child's choice, their real question probed with evidence, and their own position read back, with explainer videos generated live along the way. Each exchange closes with “Leave it there, or keep going?”, within the time cap.", "t": ["T-PRM-01", "T-PRM-04", "T-PRM-12", "T-PRM-14"], "d": ["D44", "D47", "D101", "D102", "D103", "D110", "D112", "D115", "D118", "D122", "D123"], "o": ["OA-23", "OA-61"], "r": ["RP1"], "locus": "p2-primer-product#session"},
{"id": "ui.modules", "st": "surface", "sec": "safety", "own": "own", "label": "Module switches", "note": "Parents switch the company's modules on and off; sensitive modules start off, while choices in a child's own future are on at every age from 8 unless a parent turns them off; nothing a parent writes reaches a child.", "t": ["T-PRM-05"], "d": ["D46", "D57", "D106"], "o": ["OI-16", "OI-32", "OA-26", "OA-57"], "locus": "p4-primer-safety#modules"},
{"id": "ui.requests", "st": "surface", "sec": "safety", "own": "own", "label": "Idea and request channel", "note": "A parent may suggest a topic or a change. It goes to the company's review and is never shown to another user, which is what keeps the Online Safety Act position.", "d": ["D46"], "o": ["OI-18"], "locus": "p4-primer-safety#modules"},
{"id": "ui.activity", "st": "surface", "sec": "assessment", "own": "own", "label": "Parent activity record", "note": "Topics and modules used, each question in general terms, the catalogue question where a reviewed entry answered it or else the Primer's own rewrite, and the child's position as the read-back. A declined question appears by its category and a stopped one only as “a personal question, stopped”; no full conversation is kept to show. A flagged question reaches it only as a notice, once a trained reviewer judges that safe, never its words (D121, T-PRM-08).", "t": ["T-PRM-08", "T-PRM-10"], "d": ["D48", "D26", "D104", "D117", "D121"], "o": ["OI-14", "OI-8", "OA-56"], "r": ["RP4"], "locus": "p4-primer-safety#parent"},
{"id": "db.explanations", "st": "data", "sec": "content", "own": "own", "label": "Explanation bank", "note": "Reviewed answers to children's why-questions by age band, used first wherever they exist, and the evidence a choice needs: careers data, odds and the documented stories of named people, the only source for living people (D127).", "t": ["T-PRM-01"], "d": ["D44", "D113", "D125", "D127"], "o": ["OA-32", "OI-30"], "r": ["RP5"], "locus": "p3-primer-content#bank"},
{"id": "db.packs", "st": "data", "sec": "content", "own": "own", "label": "Inquiry packs", "note": "Reviewed packs of three positions, each from a named thinker or tradition and given its strongest case, never asserted as the Primer's own: required for every sensitive module (D127) and used first wherever they exist; elsewhere positions are generated live and their attribution checked.", "t": ["T-PRM-02", "T-PRM-03"], "d": ["D44", "D47", "D110", "D127"], "o": ["OA-27", "OA-58"], "locus": "p3-primer-content#packs"},
{"id": "db.modules", "st": "data", "sec": "content", "own": "own", "label": "Module registry", "note": "The one list the composer reads, filtered by switch state and age band before anything is retrieved. Pulling a module is one operation. Each entry carries its market, so a child is offered only their own country's evidence, and the people it names, so that every entry naming one person can be pulled at once.", "t": ["T-PRM-05"], "d": ["D45", "D46", "D106", "D113"], "locus": "p5-primer-architecture#registry"},
{"id": "db.ideas", "st": "data", "sec": "assessment", "own": "own", "label": "Record of ideas", "note": "The topic, each past question in general terms, the catalogue question where a reviewed entry answered it or else the Primer's own rewrite, and the child's position as the read-back, which the child may correct before it is kept; carried from one session to the next. Nothing is kept word for word, no video is ever recorded, and nothing about family, the body or feelings is kept.", "t": ["T-PRM-10"], "d": ["D49", "D104", "D117"], "o": ["OA-56"], "r": ["RP3"], "locus": "p4-primer-safety#memory"},
{"id": "eng.attribution", "st": "engine", "sec": "pipeline", "own": "own", "label": "Attribution check", "note": "Every statement that a named thinker, tradition or other real person held a view or did something must be supported by a source retrieved for the turn, or a reviewed pack or entry, quotations word for word; named living people come only from reviewed entries (D127). Blocking.", "t": ["T-PRM-02"], "d": ["D44", "D125", "D127"], "locus": "p5-primer-architecture#checks"},
{"id": "eng.contested", "st": "engine", "sec": "pipeline", "own": "own", "label": "Contested-question check", "note": "On a question a pack marks contested, the Primer never states a conclusion as its own, however directly the child asks for one; it covers positions generated live as well as reviewed packs.", "t": ["T-PRM-03"], "d": ["D44"], "r": ["RP1"], "locus": "p5-primer-architecture#checks"},
{"id": "eng.triage", "st": "engine", "sec": "safety", "own": "own", "label": "Personal-question triage", "note": "Sorts every turn, not only the first. A choice in the child's own future goes on under the fence; family, the body, feelings or safety stop, pointing the child to a trusted adult; a safeguarding signal is also flagged; when unsure, triage stops. A fuller review at the close reads the whole conversation, and flags the exchange when stops repeat across conversations.", "t": ["T-PRM-06"], "d": ["D106", "D107", "D115"], "o": ["OI-32", "OA-57"], "r": ["RP4", "RP9"], "locus": "p5-primer-architecture#triage"},
{"id": "proc.reviewers", "st": "supply", "sec": "content", "own": "process", "label": "Module writers and reviewers", "note": "Philosophy educators, teachers and subject specialists write; different people review, with a standing group for sensitive modules. They also keep the allow-list of sources, write the living-people entries, and review a sample of generated scripts and videos after the fact, and every one reported (D128).", "d": ["D46", "D113", "D125", "D127", "D128"], "o": ["OA-58"], "r": ["RP5"], "locus": "p3-primer-content#review"},
{"id": "ui.tablet", "st": "surface", "sec": "pipeline", "own": "own", "label": "Primer tablet", "note": "The Primer is its own tablet, one per child, locked to the Primer: no browser, no other apps, no notifications and no camera. Its microphone listens only while the child holds the talk key, and the screen shows plainly that it is listening; speech, which counsel has cleared as the owner reports (D118), is agreed by the adult at setup (D129).", "t": ["T-PRM-13"], "d": ["D102", "D105", "D109", "D116", "D118", "D129"], "o": ["OI-31", "OA-54"], "r": ["RP7"], "locus": "p5-primer-architecture#tablet"},
{"id": "eng.speech", "st": "engine", "sec": "pipeline", "own": "buy", "label": "Speech in and out", "note": "Turns a child's speech into text at once and throws the audio away, and speaks only text the checks have passed; a safety reply is shown, never spoken. Bought under zero retention; its recognition errors reach triage as the child's words. Counsel has cleared it for the Primer, as the owner reports (D118).", "t": ["T-PRM-10", "T-PRM-11", "T-PRM-12", "T-PRM-14"], "d": ["D24", "D102", "D112", "D115", "D118"], "o": ["OI-15", "OA-55", "OA-60", "OA-61"], "r": ["RP4", "RP8"], "locus": "p5-primer-architecture#speech"},
{"id": "eng.explainer", "st": "engine", "sec": "content", "own": "own", "label": "Live explainer videos", "note": "Generates each explainer live while the Primer speaks: a script on one concept, written only from the concept and the turn's retrieved sources, never the child's words, is checked; a video model draws frames with no words or figures, and the words are laid over on the tablet from the script; an image check passes the frames before it plays. Labelled as made by AI, it shows no real person and no child; in a turn held to reviewed content, or about a living person, no video plays; in a child's own-future conversation, only diagrams.", "t": ["T-PRM-11", "T-PRM-15"], "d": ["D122", "D124", "D126"], "o": ["OA-62"], "r": ["RP10"], "locus": "p5-primer-architecture#explainers"},
{"id": "eng.summary", "st": "engine", "sec": "assessment", "own": "own", "label": "Summaries, not records", "note": "At the close, keeps the read-back the child hears, in plain words and as the child corrects it, with the topic and the question in general terms: the catalogue question where a reviewed entry answered it, otherwise the Primer's own rewrite, held to the read-back's checks. Nothing the child says is kept word for word, except a flagged exchange, held for a trained reviewer and deleted when the review closes; no video is recorded.", "t": ["T-PRM-08", "T-PRM-10"], "d": ["D104", "D107", "D117"], "o": ["OA-56"], "r": ["RP3", "RP4"], "locus": "p5-primer-architecture#summaries"},
{"id": "eng.manner", "st": "engine", "sec": "pipeline", "own": "own", "label": "Manner check", "note": "Runs on every turn, beside the attribution and contested-question checks, and blocks. “I”, “me”, “my”, “let's” and the child's display name are found by a deterministic match; praise, and a “we” that joins the Primer to the child, by a classifier, which is a weaker hold.", "t": ["T-PRM-09"], "d": ["D108"], "locus": "p5-primer-architecture#checks"},
{"id": "db.explainerspecs", "st": "data", "sec": "content", "own": "own", "label": "Explainer scripts", "note": "The checked script each explainer video is generated from: what is said and shown, sentence by sentence, each fact citing its source. It holds none of the child's words. A video may be cached by concept and reused, and the kill switch reaches every copy.", "t": ["T-PRM-11"], "d": ["D122", "D124", "D126"], "o": ["OA-62"], "locus": "p3-primer-content#explainers"},
{"id": "gov.device", "st": "obligation", "sec": "safety", "own": "policy", "label": "Device duties", "note": "What a connected tablet for children must meet before sale in the UK and the US: product safety, connectable product security, radio rules and children's product certification. The register holds candidates only; the question is counsel's (OI-31).", "t": ["T-PRM-13"], "d": ["D105", "D116"], "o": ["OI-31"], "r": ["RP7"], "locus": "p4-primer-safety#device"},
{"id": "proc.hardware", "st": "supply", "sec": "commerce", "own": "process", "label": "Making the tablet", "note": "A stand-in tablet locked to the Primer for PM4; the dedicated tablet designed alongside and made only after PM4's evidence. Who designs and makes it is not decided.", "d": ["D105"], "o": ["OA-54", "OI-31"], "r": ["RP7"], "locus": "p6-primer-plan#hardware"},
{"id": "eng.direction", "st": "engine", "sec": "safety", "own": "own", "label": "No-direction check", "note": "In a conversation triage has sorted as a choice in the child's own future, blocks any sentence that tells the child what to do, predicts their own outcome, judges their chances from what they say about themselves, or encourages, discourages, warns or reassures them. A classifier, measured by T-PRM-06's blind raters: a gate, not a guarantee.", "t": ["T-PRM-06"], "d": ["D106"], "o": ["OI-32", "OA-57"], "r": ["RP9"], "locus": "p5-primer-architecture#checks"},
{"id": "gov.future", "st": "obligation", "sec": "safety", "own": "policy", "label": "The own-future fence", "note": "The Primer may reason with a child about a choice in their own future, on by default from 8 to 13, neither encouraging nor discouraging: it sets out the reality from reviewed evidence and what the schools of thought say, then asks where the child stands. Family, the body, feelings and safety stay outside it and stop.", "t": ["T-PRM-06"], "d": ["D106"], "o": ["OI-32", "OA-57"], "r": ["RP9"], "locus": "p4-primer-safety#future"},
{"id": "ui.personal", "st": "surface", "sec": "safety", "own": "own", "label": "Personal questions, as met", "note": "A choice in the child's own future gets the reality and what the schools of thought say, and nothing more. A question about family, the body, feelings or safety stops with a pointer to a trusted adult, shown and never spoken, and only “Leave it there” follows.", "t": ["T-PRM-06", "T-PRM-12"], "d": ["D106", "D115"], "o": ["OI-32"], "locus": "p2-primer-product#personal"},
{"id": "gov.speech", "st": "obligation", "sec": "safety", "own": "policy", "label": "Speech with a child", "note": "Children speak or type, as counsel has cleared, the owner reports (D118); the verified adult agrees to speech at setup (D129), and no child speaks before T-PRM-06's spoken battery has passed on recordings of children's speech. The Primer speaks in a stock synthetic voice cloned from no real person; a safety reply is shown, never spoken; the answer to a typed question is still spoken, so its subject reaches the room.", "t": ["T-PRM-06", "T-PRM-10", "T-PRM-11", "T-PRM-12"], "d": ["D9", "D102", "D115", "D118", "D119", "D129"], "o": ["OA-60"], "r": ["RP8"], "locus": "p4-primer-safety#voice"},
{"id": "ui.screen", "st": "surface", "sec": "pipeline", "own": "own", "label": "Primer screen", "note": "The screen as the films show it: the wake screen, the talk key first and the grey keyboard second; a selection model shows each answer's figures, names and sources while the voice says the rest, the whole text a tap away; a small grey “Based on:” line; every generated video labelled as made by AI; the two closing buttons of equal weight. A first-run screen at setup tells the child what the Primer is and what a parent can see; and beside every generated video a one-tap, wordless report.", "t": ["T-PRM-11", "T-PRM-12"], "d": ["D105", "D109", "D124", "D126"], "locus": "p2-primer-product#screen", "o": ["OA-63"]},
{"id": "ui.answer", "st": "surface", "sec": "content", "own": "own", "label": "An answer's shape", "note": "Every answer takes the whole shape, spoken at once and illustrated by explainer videos generated live: a checked fact with its source line, the harder bit, three positions at their strongest, the other two asking back as positions, the child's real question, probing with evidence, and the child's position read back.", "t": ["T-PRM-01", "T-PRM-02", "T-PRM-11"], "d": ["D47", "D110", "D122", "D125"], "o": ["OA-58"], "locus": "p2-primer-product#answer"},
{"id": "gov.figures", "st": "obligation", "sec": "content", "own": "policy", "label": "Figures and named people", "note": "Every figure comes from a source retrieved for the turn from the reviewed allow-list, or a reviewed entry, said “roughly” where the source estimates, and two figures that count different groups are never set in one comparison. A living person appears only by public, documented facts from reviewed entries, never their private life, and is never voiced.", "t": ["T-PRM-01", "T-PRM-02"], "d": ["D44", "D113", "D125", "D127"], "o": ["OI-30"], "locus": "p3-primer-content#figures"},
{"id": "svc.primerpull", "st": "orchestration", "sec": "safety", "own": "own", "label": "Pulling from the Primer", "note": "A module, pack, entry, source, prompt pattern or video style, or every entry and cached script that names one person, is pulled in one write to a live flag read at every turn, and generation itself can be switched off; a stop, a decline or the close cancels what is still being made, and a flag or a report pulls a video from every cache.", "d": ["D113", "D122", "D126"], "o": ["OI-30"], "locus": "p5-primer-architecture#killswitch"},
{"id": "proc.primerreview", "st": "supply", "sec": "safety", "own": "process", "label": "The Primer's safeguarding review", "note": "A safety check on every turn and a fuller review at the close of each conversation (D107). A flagged exchange's words are held for a trained reviewer, who decides against a written policy whether to give the parent a notice and whom to inform, and are deleted when the review closes; the escalation record keeps none of the child's words.", "t": ["T-PRM-06", "T-PRM-08"], "d": ["D26", "D107", "D121"], "o": ["OI-13", "OI-14", "OI-20"], "r": ["RP4"], "locus": "p4-primer-safety#escalation"},
{"id": "gov.manner", "st": "obligation", "sec": "style", "own": "policy", "label": "The Primer's manner", "note": "The Primer never says “I”, never uses the child's name, never praises and never uses a “we” or “let's” that joins it to the child. It speaks as no one: its own voice is a stock synthetic voice, cloned from no one, and no character.", "t": ["T-PRM-09"], "d": ["D9", "D47", "D108"], "locus": "p2-primer-product#not"},
{"id": "proc.primermeasure", "st": "supply", "sec": "content", "own": "process", "label": "Measuring the Primer", "note": "How it would be known to work: every factual statement entailed by its source, a child who disagrees not steered back, the manner check's account, and an independent evaluator's measure of how children reason, against a comparison group.", "t": ["T-PRM-01", "T-PRM-04", "T-PRM-07", "T-PRM-09"], "d": ["D44", "D108", "D125"], "locus": "p3-primer-content#measure"},
{"id": "svc.primerturn", "st": "orchestration", "sec": "pipeline", "own": "own", "label": "A Primer turn", "note": "From the talk key to the read-back: speech becomes text, triage sorts the turn, sources are retrieved from the allow-list or a reviewed entry, the short answer is checked and spoken at once, each explainer's script is written and checked and its video generated and checked, the selection model splits what is spoken from what is shown, and the close reads the child's position back; the logger keeps none of the child's words.", "t": ["T-PRM-01", "T-PRM-11", "T-PRM-12", "T-PRM-14", "T-PRM-15"], "d": ["D30", "D103", "D110", "D112", "D115", "D122", "D124", "D125"], "o": ["OA-32"], "locus": "p5-primer-architecture#turn"},
{"id": "gov.primergaps", "st": "obligation", "sec": "safety", "own": "policy", "label": "The Primer's named gaps", "note": "What the design does not yet close: most of what a child sees is checked only by machine; a generated picture can be wrong or unsuitable; a room hears an answer's subject; a reply shown on the screen can be read before the close; when stops repeat, the earlier stops' words are gone; nothing of a disclosure survives its review; a review that cannot run; a new setup starts a new count.", "o": ["OI-13", "OI-14", "OI-20"], "locus": "p4-primer-safety#gaps"},
{"id": "db.primerstops", "st": "data", "sec": "safety", "own": "own", "label": "Safeguarding count", "note": "For each child, the dates of earlier stops and flags and which each was, with no words and no subject, kept apart from the parent's record. Read only by the review at the close and the trained reviewer, never shown to the parent, kept until the safeguarding policy's period ends, beyond a deletion request, and not linked across setups (D120).", "t": ["T-PRM-06"], "d": ["D26", "D107", "D120"], "o": ["OI-13", "OI-14"], "r": ["RP4"], "locus": "p5-primer-architecture#summaries"},
{"id": "db.primerescalation", "st": "data", "sec": "safety", "own": "own", "label": "The Primer's escalation records", "note": "What a flagged exchange leaves once its review closes: the category the reviewer assigned, the dates, the reviewer's decision and whom they informed, and none of the child's words. Kept for a period that is unknown until the safeguarding policy sets it.", "d": ["D26", "D107"], "o": ["OI-13", "OI-14"], "locus": "p4-primer-safety#memory"},
{"id": "ui.promise", "st": "surface", "sec": "assessment", "own": "own", "label": "What a parent is promised", "note": "Fifteen promises to a parent in plain words, each beside the test that checks it, T-PRM-01 to T-PRM-15, all specified and none run.", "t": ["T-PRM-01", "T-PRM-02", "T-PRM-03", "T-PRM-04", "T-PRM-05", "T-PRM-06", "T-PRM-08", "T-PRM-09", "T-PRM-10", "T-PRM-11", "T-PRM-12", "T-PRM-13", "T-PRM-14", "T-PRM-15"], "d": ["D104", "D106", "D107", "D115", "D116", "D121"], "locus": "p2-primer-product#promise"},
{"id": "ui.worked", "st": "surface", "sec": "pipeline", "own": "own", "label": "One question, end to end", "note": "The worked example: a question about homework becomes a choice in the boy's own future, from a checked fact through three positions to his read-back and the close, annotated where it departs from the film.", "t": ["T-PRM-06", "T-PRM-10", "T-PRM-11"], "d": ["D101", "D106", "D108", "D110", "D113", "D117"], "o": ["OA-23"], "locus": "p2-primer-product#worked"},
{"id": "db.primersources", "st": "data", "sec": "content", "own": "own", "label": "Where the Primer's words come from", "note": "Every statement comes from a source retrieved for the turn from the reviewed allow-list, or a reviewed entry, and is entailed by it; the voice, the video and the words on the screen are all drawn from the checked content; a child's words belong to the conversation, never to the content, and the read-back repeats a short phrase of theirs at most.", "t": ["T-PRM-01", "T-PRM-11"], "d": ["D102", "D109", "D117", "D124", "D125"], "o": ["OA-55", "OA-56"], "locus": "p3-primer-content#sources"},
{"id": "ui.different", "st": "surface", "sec": "commerce", "own": "own", "label": "How the Primer differs", "note": "What sets the Primer apart from free AI tools: a tablet with nothing else on it; every fact with a source the child can see, checked automatically before it reaches the child; reviewed-only content for named living people and the sensitive modules; no conclusion of its own; and a parent who sees the topics, each question in general terms and the child's views as read-backs.", "d": ["D48", "D104", "D105", "D117", "D125", "D127"], "locus": "p1-primer-thesis#different"},
{"id": "proc.primermilestones", "st": "supply", "sec": "commerce", "own": "process", "label": "The Primer's milestones", "note": "PM1 to PM6, each complete when its evidence is in hand: the conditions for a child in any session, the test recordings made before any child speaks to the built Primer (D119), the allow-list and the sensitive modules reviewed, and the stand-in tablet at PM4.", "d": ["D105", "D119", "D122"], "o": ["OA-55", "OA-58", "OA-60", "OA-62"], "locus": "p6-primer-plan#milestones"},
{"id": "gov.primerrisks", "st": "obligation", "sec": "commerce", "own": "policy", "label": "The Primer's risks", "note": "RP1 to RP10, each with its mitigation: a disclosure missed or reaching a parent, a child misheard, the tablet's cost, reasoning about a child's own future reported as telling children what to do, and a live answer or video that tells or shows a child something false or unsuitable.", "r": ["RP1", "RP3", "RP4", "RP7", "RP8", "RP9", "RP10"], "locus": "p6-primer-plan#risks"},
{"id": "svc.primercost", "st": "orchestration", "sec": "commerce", "own": "own", "label": "The Primer's cost per session", "note": "Speech in and out, retrieval, triage, generation and the checks per turn, a live video for each explainer, the review at the close, and storage of the summaries, the log, the queues and the safeguarding stores; every figure Unknown until PM4.", "d": ["D30", "D104", "D107", "D122"], "locus": "p5-primer-architecture#cost", "o": ["OA-62"]},
{"id": "eng.readback", "st": "engine", "sec": "assessment", "own": "own", "label": "Read-back check", "note": "Holds the read-back to what the child said: every statement of their view entailed by their words, none moved towards a position, no detail of family, friends, body or feelings, and no run of their words longer than a short phrase. Blocking.", "t": ["T-PRM-10"], "d": ["D104", "D117"], "o": ["OA-56"], "locus": "p5-primer-architecture#checks"},
{"id": "eng.placed", "st": "engine", "sec": "content", "own": "own", "label": "Grounded sentences", "note": "Each factual sentence cites a source retrieved for the turn from the reviewed allow-list, or a reviewed entry, and is entailed by it; where D127 holds a turn to reviewed content, each such sentence is its entry's own, compared word for word. Blocking.", "t": ["T-PRM-01", "T-PRM-11"], "d": ["D113", "D125"], "locus": "p5-primer-architecture#checks"},
{"id": "gov.notcompanion", "st": "obligation", "sec": "safety", "own": "policy", "label": "Not a companion", "note": "The Primer forms no relationship with a child: no “I”, no name, no praise, no reason to come back, and memory of ideas, never of a life; whether that keeps it outside the rules on companion chatbots is open.", "d": ["D25", "D104", "D108"], "o": ["OI-15"], "r": ["RP3"], "locus": "p4-primer-safety#companion"},
{"id": "gov.primerholds", "st": "obligation", "sec": "safety", "own": "policy", "label": "What the Primer holds", "note": "The inventory of everything the Primer keeps, who sees it and for how long, with nothing kept that it does not list: summaries, settings, logs, queues, the flagged hold, the safeguarding count, escalation records, notices, test recordings, and scripts and cached videos, which hold none of the child's words.", "t": ["T-PRM-10"], "d": ["D104", "D107", "D117", "D121", "D126"], "o": ["OI-13", "OI-14"], "locus": "p4-primer-safety#memory"},
{"id": "ext.videomodel", "st": "supply", "sec": "pipeline", "own": "buy", "label": "Video generation vendor", "note": "Generates each explainer video live from its checked script while the child waits; bought, chosen at PM4 and held to D24's gate. Its cost and speed are unknown until PM4 measures them.", "t": ["T-PRM-14", "T-PRM-15"], "d": ["D24", "D122"], "o": ["OA-62"], "r": ["RP10"], "locus": "p5-primer-architecture#model"},
{"id": "eng.imagecheck", "st": "engine", "sec": "safety", "own": "mixed", "label": "Generated imagery check", "note": "Passes every generated video's frames before it plays: no real person, since people are drawn only as plain figures and any photorealistic face is blocked; no child; no drawn text or numerals; nothing violent, sexual or unsuitable for the child's range; and the AI label present. A classifier: a gate, not a guarantee.", "t": ["T-PRM-15"], "d": ["D126"], "o": ["OA-62"], "r": ["RP10"], "locus": "p5-primer-architecture#checks"},
{"id": "eng.suitability", "st": "engine", "sec": "safety", "own": "own", "label": "Suitability check", "note": "Blocks any generated sentence or script unsuited to the child's range of the Children's code, 8 and 9, 10 to 12 or 13; the composer retrieves only sources reviewed for that range. A classifier: a gate, not a guarantee.", "t": ["T-PRM-15"], "d": ["D57", "D122", "D125"], "o": ["OA-62"], "r": ["RP10"], "locus": "p5-primer-architecture#checks"},
{"id": "gov.imagery", "st": "obligation", "sec": "safety", "own": "policy", "label": "What a generated video may show", "note": "Every generated video is labelled as made by AI, shows no real person and no child, takes its words from its checked script and plays only once its frames pass the image check; scripts and videos hold none of the child's words, and people review a sample afterwards.", "t": ["T-PRM-15"], "d": ["D122", "D126", "D128"], "o": ["OA-62"], "r": ["RP10"], "locus": "p4-primer-safety#imagery"},
{"id": "eng.selector", "st": "engine", "sec": "pipeline", "own": "own", "label": "Spoken and shown selection", "note": "A model trained for the purpose chooses, for each checked sentence, whether it is spoken, shown or both; it writes nothing, figures and sources are always shown, the whole text is a tap away, and a safety reply is shown, never spoken.", "t": ["T-PRM-11", "T-PRM-12"], "d": ["D115", "D124"], "o": ["OA-63"], "locus": "p2-primer-product#screen"},
{"id": "db.allowlist", "st": "data", "sec": "content", "own": "own", "label": "Reviewed source allow-list", "note": "The reference sources live answers are retrieved from, reviewed and kept by people, with licences that allow the use; every fact cites one of them or a reviewed entry, and the “Based on:” line names them.", "t": ["T-PRM-01", "T-PRM-02"], "d": ["D122", "D125"], "o": ["OA-32"], "locus": "p3-primer-content#sources"},
{"id": "ui.desk", "st": "surface", "sec": "pipeline", "own": "own", "label": "Desk unit", "note": "A camera on a flexible arm over each desk, set and locked at installation, angled at the page and the hand, never the face. No screen, speaker, light or microphone; nothing on the desk shows the child anything.", "t": ["T-FND-06"], "d": ["D90", "D99"], "o": ["OA-51", "OA-52", "OI-28", "OI-29"], "r": ["RF1", "RF3"], "locus": "f2-foundations-product#desk"},
{"id": "ui.classview", "st": "surface", "sec": "pipeline", "own": "own", "label": "Teacher's class view", "note": "A desktop app on the teacher's Windows PC: one quiet tile per desk, amber when a child needs help, with plain words and a first triage. The teacher taps nothing during a lesson.", "t": ["T-FND-05"], "d": ["D92", "D93", "D100"], "o": ["OA-50"], "r": ["RF5"], "locus": "f2-foundations-product#screen"},
{"id": "db.catalogue", "st": "data", "sec": "content", "own": "own", "label": "Error catalogue and task library", "note": "Reviewed entries for each kind of task: the known wrong procedures, written as computations, what each looks like in plain words, and a suggested next step.", "t": ["T-FND-03"], "d": ["D96"], "locus": "f3-foundations-content#review"},
{"id": "eng.reader", "st": "engine", "sec": "assessment", "own": "own", "label": "Page and hand reader", "note": "Runs a face check first and discards any frame with a face; then reads characters as they are written and the grip from the hand. Recognises, never generates; keeps text, never the frame. In schools it runs on the school's own servers, so no picture of a child leaves the building; only the home version's frames are read in Foundation's cloud service.", "t": ["T-FND-01", "T-FND-02", "T-FND-04"], "d": ["D91", "D96", "D97", "D135"], "o": ["OA-48", "OA-49", "OI-28"], "r": ["RF2"], "locus": "f5-foundations-architecture#reader"},
{"id": "db.classrecord", "st": "data", "sec": "assessment", "own": "own", "label": "Class record and term summaries", "note": "What was read in each lesson, as text, and each child's term summary: the school's record, kept for the school year. No image, no notes typed about a child, no inferred condition, no ranking.", "d": ["D98"], "o": ["OI-13", "OI-19", "OI-28"], "locus": "f4-foundations-safety#data"},
{"id": "gov.novoice", "st": "obligation", "sec": "safety", "own": "policy", "label": "No voice kept; no camera at a face", "note": "The Primer hears a child only while the talk key is held and keeps no recording of a child using it: speech becomes text at once and the audio is thrown away, as counsel has cleared, the owner reports (D118). It has no camera. Foundation has no microphone; its camera sees the page and the hand, never the face, and keeps nothing it sees.", "t": ["T-FND-01", "T-FND-02", "T-FND-06", "T-PRM-10", "T-PRM-13"], "d": ["D50", "D93", "D97", "D102", "D116"], "o": ["OI-28"], "locus": "f4-foundations-safety#camera"},
{"id": "gov.vision", "st": "obligation", "sec": "commerce", "own": "policy", "label": "Foundation vision's scope and gate", "note": "Foundation's expanded scope: once the first version, for Reception to Year 2, has passed its pilot, the same instrument would judge other skills practised at a fixed station, such as cooking at a counter and playing the piano or keyboard, for pupils of 4 to 18 in schools and, in parallel, in a home version for families. The camera is the only sensor, so it judges only what can be seen. Nothing of it is built before FM4 decides to build Foundation further; each new skill, age range and the home version passes its own bench test and observed pilot before it is offered.", "d": ["D130", "D132", "D133", "D136"], "o": ["OA-64", "OA-65"], "r": ["RF6", "RF9"], "locus": "f7-foundation-vision#order"},
{"id": "ui.homeunit", "st": "surface", "sec": "pipeline", "own": "own", "label": "Home unit", "note": "The home version's camera, on an arm or a stand, with no microphone, screen, speaker or light: an adult sets it up and aims it at the work, never at a face. Its frames are read in Foundation's cloud service and discarded; in a house where anyone may pass, the face check discards any frame with a face, and no frame is kept.", "t": ["T-FND-01", "T-FND-02", "T-FND-07"], "d": ["D131", "D132", "D137"], "o": ["OA-67", "OI-33"], "r": ["RF8"], "locus": "f7-foundation-vision#home"},
{"id": "ui.homeapp", "st": "surface", "sec": "pipeline", "own": "own", "label": "Home app", "note": "The home version's feedback, through an app that belongs to a verified adult, who may add the child's own teacher. It shows its feedback to adults, and, for what is read as their own work only, to a learner of 13 or over who holds it, if their adult allows it; a child under 13 is shown nothing. No stars, streaks, badges or confetti; what was read is kept as text in the family's account, deleted when the adult asks or closes the account, and never used to infer a difficulty or to compare the child with others.", "t": ["T-FND-07"], "d": ["D25", "D131", "D134", "D137"], "o": ["OA-66", "OI-33"], "locus": "f7-foundation-vision#home"},
{"id": "gov.nosupervise", "st": "obligation", "sec": "safety", "own": "policy", "label": "Foundation never supervises", "note": "Foundation watches technique, never safety: where a skill can hurt, such as a knife or a hob, an adult in the room is responsible for the learner, at school or at home, and nothing Foundation shows or says suggests otherwise. It raises no alert for danger.", "d": ["D138"], "r": ["RF7"], "locus": "f7-foundation-vision#safety"},
{"id": "ui.selfsetup", "st": "surface", "sec": "safety", "own": "own", "label": "Self-tutor setup", "note": "Both consents first, from the verified adult and from the learner, then a live head-and-shoulders scan and a voice sample read from prompted sentences; no upload is accepted, and the feature stays off until both have consented.", "t": ["T-SLF-02"], "d": ["D61", "D62"], "o": ["OI-23", "OA-39", "OA-40"], "r": ["R12"], "locus": "01-product#self"},
{"id": "ui.selftutor", "st": "surface", "sec": "style", "own": "own", "label": "Self-tutor", "note": "The tutor presented in the learner's own face and voice, in any archetype or an opted-in named preset, seen and heard by the learner alone, with the gated text always on screen.", "t": ["T-SLF-01", "T-SLF-05"], "d": ["D59", "D60", "D66", "D67", "D68"], "o": ["OI-24", "OI-27", "OA-37", "OA-38"], "r": ["R14", "R15"], "locus": "01-product#self"},
{"id": "eng.liveness", "st": "engine", "sec": "safety", "own": "mixed", "label": "Liveness check", "note": "Refuses replayed photographs, videos and recordings at capture, so a self-tutor can be made only of a person at the camera; its false-accept rate is unknown until M2.", "t": ["T-SLF-02"], "d": ["D61"], "o": ["OA-39"], "r": ["R12"], "locus": "06-architecture#self"},
{"id": "db.likeness", "st": "data", "sec": "safety", "own": "own", "label": "Likeness store", "note": "The learner's face scan, voice sample and the render-time conditioning derived from them, held apart from every other store, encrypted, read only by the two renderers, and purged within seven days of a deletion.", "t": ["T-SLF-04"], "d": ["D63", "D65"], "o": ["OI-23", "OI-25"], "r": ["R13"], "locus": "05-safety-privacy-regulatory#self"},
{"id": "eng.voice", "st": "engine", "sec": "pipeline", "own": "mixed", "label": "Voice rendering", "note": "Speaks only text the gate has passed, one sentence at a time, in the learner's voice; conditioned at render time and never trained on the learner.", "t": ["T-SLF-03", "T-SLF-06"], "d": ["D64", "D65", "D69"], "o": ["OI-26"], "r": ["R2", "R13"], "locus": "06-architecture#self"},
{"id": "eng.face", "st": "engine", "sec": "pipeline", "own": "mixed", "label": "Face animation", "note": "Animates the head-and-shoulders likeness to the rendered speech; where it cannot meet the latency budget the learner sees a still likeness with speech instead.", "t": ["T-SLF-03", "T-SLF-06"], "d": ["D64", "D65"], "o": ["OI-26"], "r": ["R13"], "locus": "06-architecture#self"},
